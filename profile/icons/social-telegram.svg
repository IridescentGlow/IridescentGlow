<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Telegram">
  <title>Telegram</title>
  <style>
    .wipe { animation: wipe 4.0s infinite both; animation-delay: 0.12s; }
    @keyframes wipe {
      0%, 40.0% { transform: translateX(0); animation-timing-function: cubic-bezier(.3,0,.2,1); }
      47.5%, 62.5% { transform: translateX(32px); animation-timing-function: cubic-bezier(.6,0,.8,1); }
      70.0%, 100% { transform: translateX(64px); }
    }
    @media (prefers-reduced-motion: reduce) { .wipe { animation: none; } }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#37AEE2"/><stop offset="1.00" stop-color="#1E96C8"/></linearGradient>
    <linearGradient id="edge">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".2" stop-color="#fff"/>
      <stop offset=".8" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="reveal" maskUnits="userSpaceOnUse" x="-2" y="-2" width="28" height="28">
      <rect class="wipe" x="-40" y="-4" width="40" height="32" fill="url(#edge)"/>
    </mask>
  </defs>
